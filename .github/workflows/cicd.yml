
name: CI Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Check HTML File
        run: test -f app/index.html

      - name: Check CSS File
        run: test -f app/style.css

      - name: Validate Terraform
        run: |
          docker run --rm \
            -v "$PWD/infra:/workspace" \
            -w /workspace \
            hashicorp/terraform:latest \
            fmt -check -recursive

      - name: CI Completed
        run: echo "All validation checks passed!"
